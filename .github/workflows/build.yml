name: Build

# Fork/本地验证用的全平台构建：只负责产出安装包，不跑安装、更新冒烟，也不创建 Release。
# 正式发版仍走 release.yml。所有 job 使用 SDK main 源码，避免依赖尚未发布的 SDK 版本。
on:
  push:
    branches: [ci-build]
  workflow_dispatch:
    inputs:
      version:
        description: 构建版本号（MAJOR.MINOR.PATCH）
        required: true
        default: '9.9.9'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.derive.outputs.name }}
      code: ${{ steps.derive.outputs.code }}
    steps:
      - name: Derive version
        id: derive
        shell: bash
        env:
          VERSION: ${{ inputs.version || '9.9.9' }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH"
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/piko-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PIKO_VERSION_NAME: ${{ needs.version.outputs.name }}
      PIKO_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            variant=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/piko-$PIKO_VERSION_NAME-$variant.apk"
          done
          cp app/build/outputs/mapping/release/mapping.txt "dist/piko-$PIKO_VERSION_NAME-mapping.txt"
          ls -lh dist

      - uses: actions/upload-artifact@v6
        with:
          name: android-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      ORG_GRADLE_PROJECT_pikoDesktopVersion: ${{ needs.version.outputs.name }}
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Install WiX Toolset
        continue-on-error: true
        run: choco install wixtoolset -y --no-progress

      - name: Build application image and MSI
        run: .\gradlew.bat :desktopApp:createReleaseDistributable :desktopApp:packageReleaseMsi --stacktrace

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binaries = 'desktopApp/build/compose/binaries/main-release'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & .github/scripts/pack-portable.ps1 -AppDir "$binaries/app/Piko" -Output "dist/piko-windows-${{ matrix.arch }}-$env:VERSION.7z"
          $msi = Get-ChildItem "$binaries/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw 'packageReleaseMsi 没有产出 MSI' }
          Copy-Item $msi.FullName "dist/piko-windows-${{ matrix.arch }}-$env:VERSION.msi"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: version
    runs-on: macos-15
    env:
      ORG_GRADLE_PROJECT_pikoDesktopVersion: ${{ needs.version.outputs.name }}
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Build DMG
        run: ./gradlew :desktopApp:packageReleaseDmg --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          set -euo pipefail
          dmg=$(ls desktopApp/build/compose/binaries/main-release/dmg/*.dmg | head -n 1)
          mkdir -p dist
          cp "$dmg" "dist/piko-macos-arm64-$VERSION.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v6
        with:
          name: macos-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      ORG_GRADLE_PROJECT_pikoDesktopVersion: ${{ needs.version.outputs.name }}
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: NihilDigit/pikpak-kotlin
          path: pikpak-kotlin

      - name: Build against the SDK source
        shell: bash
        run: echo "pikpak.sdk.dir=pikpak-kotlin" >> local.properties

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v5

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsync appstream desktop-file-utils xvfb

      - name: Build AppImage
        run: xvfb-run -a ./gradlew :desktopApp:packageReleaseAppImage --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main-release/appimage/piko-linux-x64-"$VERSION".* dist/
          ls -lh dist
          test -x "dist/piko-linux-x64-$VERSION.AppImage"

      - uses: actions/upload-artifact@v6
        with:
          name: linux-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
